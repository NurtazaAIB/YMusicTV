name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project source
        run: unzip -o YMusicTV-source-v0.9.zip -d extracted && cp -a extracted/YMusicTV-v0.9/. .
      - name: Static pre-build check
        run: python3 prebuild_check.py
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YMusicTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
