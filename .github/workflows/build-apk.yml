name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply release patch
        run: python3 tools/patch_0981.py
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YMusicTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Pack source snapshot
        run: zip -r YMusicTV-source.zip app tools build.gradle.kts settings.gradle.kts gradle.properties .github/ymusictv-test.keystore.b64
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: YMusicTV-source-snapshot
          path: YMusicTV-source.zip
          if-no-files-found: error
